# ============================================================================
# UniPlan — Docker Compose (PostgreSQL 16)
# ============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: uniplan-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uniplan
    volumes:
      - uniplan_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uniplan"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  uniplan_pgdata:
    driver: local
